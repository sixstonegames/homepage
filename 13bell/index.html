<title>열세 번째 종 — 제1회차</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 폭풍우 밤의 저택. 짙은 녹흑 바탕, 놋쇠색 하나로 강조, 가상세계 균열만 아주 가끔 청록으로. 이야기는 명조, 조작은 고딕, 코드·시간은 고정폭. 한 열(최대 720px) 구성. */
:root{
  color-scheme: dark;
  --ink:#0e1412;
  --panel:#162019;
  --panel-2:#1c2822;
  --line:#2b3a33;
  --paper:#e8e1cf;
  --muted:#98a59d;
  --brass:#c8a25a;
  --brass-ink:#1a1408;
  --blood:#c25546;
  --alive:#7fb68a;
  --glitch:#6fe0d3;
  --f-display:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:6px;
}
body{background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:16px;line-height:1.7;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 72px;display:flex;flex-direction:column;gap:28px}
a{color:var(--brass)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h2{font-size:1.5rem}
h3{font-size:1.15rem;color:var(--brass)}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:12px}
.topbar a{text-decoration:none}
.backlink{display:inline-flex;align-items:center;min-height:44px;padding-right:12px;font-weight:600;color:var(--brass)}
section.block{display:flex;flex-direction:column;gap:12px}
ul.clean,ol.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
blockquote.story{margin:0;padding:4px 0 4px 18px;border-left:2px solid var(--brass);font-family:var(--f-display);font-size:1.06rem;line-height:1.9;display:flex;flex-direction:column;gap:12px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:420px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.8rem;letter-spacing:.04em;background:var(--panel)}
tr:last-child td{border-bottom:0}
td.num,th.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{appearance:none;border:1px solid var(--brass);background:transparent;color:var(--brass);font:600 .95rem/1 var(--f-ui);padding:12px 16px;border-radius:var(--r);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{background:rgba(200,162,90,.08)}
.btn.primary{background:var(--brass);color:var(--brass-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line);color:var(--paper)}
.btn.danger{border-color:var(--blood);color:var(--blood)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,label.chk:focus-within{outline:2px solid var(--glitch);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.92rem}

/* 홈 */
.hero{position:relative;padding-block:56px 32px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.hero h1{font-size:clamp(2.4rem,9vw,3.6rem);letter-spacing:-.01em}
.hero .round{font-family:var(--f-mono);font-size:.95rem;color:var(--brass);letter-spacing:.2em}
.hero .meta{color:var(--muted);font-size:.95rem}
.bolt{position:absolute;right:-10px;top:0;width:140px;height:220px;opacity:0;pointer-events:none;animation:flash 13s infinite}
.bolt path{fill:none;stroke:var(--paper);stroke-width:2.2;stroke-linejoin:round}
@keyframes flash{0%,93%,100%{opacity:0}94%{opacity:.85}95%{opacity:.1}96%{opacity:.7}97.5%{opacity:0}}
.charlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.charlist a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--paper);background:var(--panel)}
.charlist a small{color:var(--muted)}

/* 캐릭터 */
.charhead{display:flex;flex-direction:column;gap:6px;padding-block:20px 4px}
.charhead h1{font-size:2.2rem}
.killer-flag{align-self:flex-start;border:1px solid var(--blood);color:var(--blood);font-weight:600;font-size:.85rem;padding:4px 10px;border-radius:999px}
.secret{border:1px solid var(--blood);border-radius:var(--r);padding:14px 16px;background:rgba(194,85,70,.07)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.timeline li{display:grid;grid-template-columns:5.2em 1fr;gap:12px}
.timeline .t{font-family:var(--f-mono);color:var(--brass);font-variant-numeric:tabular-nums;font-size:.9rem;padding-top:2px}
.timeline .d{min-width:0}
.goal{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.goal:last-child{border-bottom:0}
.pts{font-family:var(--f-mono);color:var(--ink);background:var(--brass);border-radius:4px;padding:1px 7px;font-size:.85rem;font-weight:600}
ul.rel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.rel li{display:grid;grid-template-columns:4.2em 1fr;gap:12px}
ul.rel li b{font-family:var(--f-display);color:var(--paper)}
ul.rel li span{min-width:0}
.turn{border:1px solid var(--brass);border-radius:var(--r);background:var(--panel);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.turn b{font-family:var(--f-display);font-size:1.4rem}
.event{border:1px solid var(--brass);border-radius:var(--r);background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.odd{font-family:var(--f-display);font-style:italic;color:var(--glitch);opacity:.9}

/* 카드 */
.card{border:1px solid var(--brass);border-radius:var(--r);background:var(--panel-2);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.card .cid{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.card h4{margin:0;font-family:var(--f-display);font-size:1.15rem}
.card .body{font-family:var(--f-display);line-height:1.85}
.card .code{font-family:var(--f-mono);font-size:.85rem;color:var(--brass);border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card .code b{letter-spacing:.2em;font-size:1rem}
.boxform{display:flex;gap:8px;flex-wrap:wrap}
.boxform input{flex:1 1 140px;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--paper);border-radius:var(--r);padding:10px 12px;font:600 1.05rem var(--f-mono);letter-spacing:.2em;text-transform:uppercase;min-height:44px}
.boxmsg{font-size:.88rem;min-height:1.4em}
.boxmsg.err{color:var(--blood)}
.boxmsg.ok{color:var(--alive)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:.8rem;cursor:pointer;text-decoration:underline;padding:0}

/* 진행 화면 */
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.rail div{height:6px;border-radius:3px;background:var(--line)}
.rail div.done{background:rgba(200,162,90,.45)}
.rail div.now{background:var(--brass)}
.phasehead{display:flex;flex-direction:column;gap:4px}
.phasehead h2{font-size:1.8rem}
.clock{font-family:var(--f-mono);font-size:clamp(3.4rem,18vw,5.6rem);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.clock.over{color:var(--blood)}
.clock.paused{opacity:.55}
.locgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.loc{appearance:none;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--paper);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px;font:inherit}
.loc:hover:not(:disabled){border-color:var(--brass)}
.loc b{font-family:var(--f-display);font-size:1.05rem}
.loc small{color:var(--muted);font-size:.8rem}
.loc:disabled{opacity:.4;cursor:not-allowed}
.loc.new{border-color:rgba(200,162,90,.6)}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.97);z-index:50;display:flex;align-items:center;justify-content:center;
  padding:max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));overflow-y:auto}
.overlay .inner{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}

/* 엔딩 */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.75rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.now{border-color:var(--brass);color:var(--brass)}
.sys{font-family:var(--f-mono);color:var(--glitch);letter-spacing:.06em;font-style:normal;font-size:.98rem}
.tag-red{color:var(--blood);font-family:var(--f-mono);font-weight:600}
.tag-green{color:var(--alive);font-family:var(--f-mono);font-weight:600}
.glitch{animation:glitch 1.4s steps(1,end) 1}
@keyframes glitch{
  0%{clip-path:inset(0 0 0 0);transform:none;filter:none}
  8%{clip-path:inset(12% 0 63% 0);transform:translate(-6px,0);filter:drop-shadow(3px 0 var(--glitch))}
  16%{clip-path:inset(54% 0 18% 0);transform:translate(7px,0);filter:drop-shadow(-3px 0 var(--blood))}
  24%{clip-path:inset(30% 0 42% 0);transform:translate(-3px,0)}
  32%{clip-path:inset(0 0 0 0);transform:none;filter:none;opacity:.2}
  40%{opacity:1}
  48%{clip-path:inset(70% 0 5% 0);transform:translate(5px,0);filter:drop-shadow(2px 0 var(--glitch))}
  56%,100%{clip-path:inset(0 0 0 0);transform:none;filter:none;opacity:1}
}
.calc td{vertical-align:middle}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer;white-space:nowrap}
label.chk input{width:18px;height:18px;accent-color:var(--brass)}
label.chk select{background:var(--panel);color:var(--paper);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font:inherit}
tr.lowest td{background:rgba(194,85,70,.12)}
tr.lowest td:first-child{color:var(--blood)}
.gate{border:1px dashed var(--blood);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* 그림 */
.hero.art{padding:0;gap:0;aspect-ratio:16/9;border-radius:var(--r);border:1px solid var(--line);isolation:isolate}
.hero-art,.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:-2}
.hero.art::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(14,20,18,.65) 0%,rgba(14,20,18,0) 38%,rgba(14,20,18,0) 55%,rgba(14,20,18,.92) 100%)}
.hero.art .hero-top{padding:22px 20px 0;display:flex;flex-direction:column;gap:6px}
.hero.art h1{text-shadow:0 2px 18px rgba(0,0,0,.7)}
.hero.art .meta{margin-top:auto;padding:0 20px 16px;color:var(--paper);text-shadow:0 1px 8px rgba(0,0,0,.8)}
@media (max-width:600px){.hero.art{aspect-ratio:3/4}}
.charlist a img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 12%;border-radius:4px;margin-bottom:6px}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.cast figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cast img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);display:block}
.cast figcaption{display:flex;flex-direction:column;line-height:1.35}
.cast figcaption b{font-family:var(--f-display)}
.cast figcaption small{color:var(--muted);font-size:.8rem}
.charhead.has-art{display:grid;grid-template-columns:clamp(112px,32vw,176px) 1fr;gap:16px;align-items:end}
.charhead .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.charhead .portrait{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);display:block}
.cardback{width:clamp(120px,36vw,170px);aspect-ratio:2/3;object-fit:cover;border-radius:8px;align-self:center;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.endart{margin:4px 0}
.endart img{width:100%;border-radius:var(--r);display:block}

@media (prefers-reduced-motion: reduce){
  .bolt{animation:none;opacity:.25}
  .glitch{animation:none}
}
</style>

  {name:'오프닝·대본 읽기', min:20, guide:'타이머를 시작하기 전에 모두 함께 규칙서를 읽습니다. 타이머를 켜면 한 명이 규칙서의 오프닝을 소리 내어 읽습니다. 이어서 각자 자기 대본을 읽고 윤재혁부터 면담 순서대로 공개 자기소개를 합니다.'},

  '<section class="block"><h3>당신의 비밀</h3><div class="secret">'+c.secret+'</div></section>'+

  '<section class="block"><h3>당신이 아는 것</h3><ul class="clean">'+knows+'</ul></section>'+
  '<section class="block"><h3>다른 사람들에 대해</h3><ul class="rel">'+rel+'</ul></section>'+

    '<p class="boxmsg" id="boxmsg" aria-live="polite"></p><div class="stack" id="boxlist"></div></section>';

  function drawBox(){
    var list = document.getElementById('boxlist');

  drawBox();
  document.getElementById('boxform').addEventListener('submit', function(e){
    e.preventDefault();

/* ---------- 진행 화면 ---------- */
var HKEY = 'bell13-host';
function freshHost(){ return {phase:0, remain:PHASES[0].min*60000, endAt:null, drawn:[], tn:0, reveal:null, ending:null, log:[], pp:{}}; }
function lapCap(p, ti, loc){ return (p.inv===2 && ti.lap===1 && COMMON.indexOf(loc)!==-1) ? 3 : 2; }
function lapFull(p, ti, loc){
  var t0 = ti.lap===1 ? 0 : ORDER.length;
  var n = (host.log||[]).filter(function(e){ return e.ph===host.phase && e.t>=t0 && e.t<t0+ORDER.length && e.loc===loc; }).length;
  return n >= lapCap(p, ti, loc);
}
var host = null;
var wakeLock = null;
function saveHost(){ store.set(HKEY, host); }
function remainingMs(){ return host.endAt ? host.endAt - Date.now() : host.remain; }
function fmt(ms){
  var neg = ms < 0, s = Math.ceil(Math.abs(ms)/1000);
  if(neg) s = Math.floor(Math.abs(ms)/1000);
  var m = Math.floor(s/60), r = s%60;
  return (neg?'+':'')+String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');
}
function beep(){
  try{
    var A = window.AudioContext || window.webkitAudioContext; if(!A) return;
    var ctx = new A(), t = ctx.currentTime;
    [0,0.35,0.7].forEach(function(d){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 523; o.type='sine'; g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.3,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.3);
      o.connect(g); g.connect(ctx.destination); o.start(t+d); o.stop(t+d+0.32);
    });
  }catch(e){}
}
function requestWake(){
  try{ if(navigator.wakeLock && !wakeLock){ navigator.wakeLock.request('screen').then(function(l){ wakeLock=l; l.addEventListener('release',function(){ wakeLock=null; }); }).catch(function(){}); } }catch(e){}
}
function locAvail(loc, round){
  return CARDS.filter(function(c){ return c.loc===loc && !c.pub && c.round>=1 && c.round<=round && host.drawn.indexOf(c.code)===-1; });
}
function turnInfo(p){
  var t = host.tn || 0;
  if(t >= ORDER.length*2) return null;
  var start = (p.inv-1) % ORDER.length;
  return {who:ORDER[(start+t) % ORDER.length], lap: t < ORDER.length ? 1 : 2};
}
function allowedLocs(p, ti){
  var own = ti.who+'의 방';
  var base0 = LOCS.filter(function(l){ return l!==own && locAvail(l,p.inv).length; });
  var base = base0.filter(function(l){ return !lapFull(p, ti, l); });
  if(!base.length) base = base0;
  if(p.inv===2){
    var want = base.filter(function(l){ return ti.lap===1 ? COMMON.indexOf(l)!==-1 : COMMON.indexOf(l)===-1; });
    if(want.length) return want;
  }
  if(base.length) return base;
  return LOCS.filter(function(l){ return locAvail(l,p.inv).length; });
}

function renderHost(){
  host = store.get(HKEY, null) || freshHost();
  if(typeof host.tn !== 'number') host.tn = 0;
  if(host.ending){ renderEnding(); return; }
  var p = PHASES[host.phase];
  if(p.reveal && !host.reveal){
    var left = CARDS.filter(function(c){ return c.round>=1 && !c.pub && host.drawn.indexOf(c.code)===-1 && NO_REVEAL.indexOf(c.code)===-1; });
    if(left.length){ host.reveal = left[Math.floor(Math.random()*left.length)].code; host.drawn.push(host.reveal); }
    else host.reveal = 'none';
    saveHost();
  }
  var revealBlock = (p.reveal && host.reveal && host.reveal!=='none') ? '<section class="event"><span class="eyebrow">최종 토론 시작 · 한 명이 소리 내어 읽기</span><h3>집사가 치우다 발견한 것</h3><blockquote class="story"><p>“이런 게 아직 남아 있었습니다. 폭풍이 그치면 다리가 복구될 겁니다.”</p></blockquote>'+cardHTML(CARD_BY_CODE[host.reveal])+'<p class="muted" style="font-size:.85rem">이 카드는 모두에게 공개된 카드입니다. 누구의 것도 아닙니다.</p></section>' : '';
  var rail = PHASES.map(function(_,i){ return '<div class="'+(i<host.phase?'done':i===host.phase?'now':'')+'"></div>'; }).join('');
  var running = !!host.endAt;
  var inv = '';
  if(p.inv){
    var ti = turnInfo(p);
    if(ti){
      var allow = allowedLocs(p, ti);
      var hint = p.inv===2 ? (ti.lap===1 ? '이번 바퀴는 공용 장소(서재·복도·거실·식당)에서 고르세요.' : '이번 바퀴는 다른 사람의 방에서 고르세요.') : '자기 방 말고 아무 곳이나 고르세요.';
      var tiles = LOCS.map(function(loc){
        var unlocked = CARDS.some(function(c){ return c.loc===loc && c.round>=1 && c.round<=p.inv; });
        var avail = locAvail(loc, p.inv);
        var ok = allow.indexOf(loc) !== -1;
        var isNew = p.inv===2 && CARDS.some(function(c){ return c.loc===loc && c.round===2 && !c.pub && host.drawn.indexOf(c.code)===-1; });
        var sub = !unlocked ? '2차 조사에 열림' : !avail.length ? '모두 조사함' : loc===ti.who+'의 방' ? '내 방은 고를 수 없음' : (!ok && lapFull(p, ti, loc)) ? '이번 바퀴 '+lapCap(p, ti, loc)+'명이 이미 고름' : !ok ? '이번 바퀴엔 고를 수 없음' : '남은 카드 '+avail.length+'장';
        return '<button class="loc'+(isNew&&ok?' new':'')+'" type="button" data-loc="'+loc+'"'+(ok?'':' disabled')+'><b>'+loc+'</b><small>'+sub+(isNew&&ok?' · 새 카드':'')+'</small></button>';
      }).join('');
      inv = '<section class="block"><h3>조사하기</h3>'+
        '<div class="turn"><span class="eyebrow">지금 차례 · '+ti.lap+'번째 바퀴 · '+((host.tn||0)+1)+' / '+(ORDER.length*2)+'</span><b>'+ti.who+'</b><span class="muted" style="font-size:.9rem">'+hint+' 장소를 누르면 화면을 가린 뒤 카드가 나옵니다.</span></div>'+
        '<div class="locgrid" id="locgrid">'+tiles+'</div>'+
        '<div class="row"><button class="btn ghost" id="skipturn" type="button">이번 차례 건너뛰기</button></div></section>';
    } else {
      inv = '<section class="block"><h3>조사하기</h3><p class="note">이번 조사는 끝났습니다. 다음 단계로 넘어가세요.</p></section>';
    }
  }
  var voteBlock = p.vote ? '<section class="block"><div class="note stack"><p><b>투표 방법</b></p><ol class="clean"><li>점수표에 범인 이름 한 명, 알아낸 비밀(대상 한 명마다 한 줄), 이 저택에서 이상했던 점을 적습니다.</li><li>“하나, 둘, 셋” 하면 다섯 명이 동시에 공개합니다.</li><li>가장 많이 지목된 사람을 확인하고 엔딩을 엽니다.</li></ol></div><button class="btn primary" id="openEnding" type="button">투표 끝 · 엔딩 열기</button></section>' : '';

  app.innerHTML = topbar('진행 화면')+
  '<div class="rail" aria-hidden="true">'+rail+'</div>'+
  '<section class="phasehead"><span class="eyebrow">단계 '+(host.phase+1)+' / '+PHASES.length+'</span><h2>'+p.name+'</h2></section>'+
  revealBlock +
  (p.event ? '<section class="event"><span class="eyebrow">중반 이벤트 · 한 명이 소리 내어 읽기</span><h3>'+p.event.title+'</h3><blockquote class="story"><p>'+p.event.text+'</p></blockquote>'+
    CARDS.filter(function(c){ return c.pub && c.round===p.inv; }).map(function(c){ return '<span class="eyebrow">함께 공개되는 카드</span>'+cardHTML(c); }).join('')+
    (p.inv===2 ? '<p class="muted" style="font-size:.85rem">이 카드는 모두에게 공개된 카드입니다. 필요한 사람은 코드를 자기 카드함에 넣어 두세요.</p>' : '')+'</section>' : '')+
  '<section class="stack"><div class="clock'+(running?'':' paused')+'" id="clock" role="timer" aria-live="off">'+fmt(remainingMs())+'</div>'+
    '<div class="row"><button class="btn primary" id="toggle" type="button">'+(running?'일시정지':'타이머 시작')+'</button>'+
    '<button class="btn ghost" id="minus" type="button">−1분</button><button class="btn ghost" id="plus" type="button">+1분</button></div>'+
    '<p>'+((p.reveal && host.reveal==='none') ? p.guide.replace('먼저 진행 화면에 뜬 ‘집사가 치우다 발견한 것’을 한 명이 소리 내어 읽습니다. ', '이번 게임은 남은 카드가 모두 공개 제외 대상이라 ‘집사가 치우다 발견한 것’이 없습니다. 바로 시작합니다. ') : p.guide)+'</p>'+
    '<div class="row"><button class="btn ghost" id="prev" type="button"'+(host.phase===0?' disabled':'')+'>이전 단계</button>'+
    (host.phase<PHASES.length-1?'<button class="btn" id="next" type="button">다음 단계: '+PHASES[host.phase+1].name+'</button>':'')+'</div></section>'+
  inv + voteBlock +
  '<section class="block" style="margin-top:12px"><label class="chk" style="white-space:normal"><input type="checkbox" id="online"'+(host.online?' checked':'')+'> 온라인 모드 (화면 공유용: 뽑은 카드의 내용 대신 코드만 표시)</label><button class="btn danger" id="reset" type="button">새 게임으로 초기화</button></section>';

  var clockEl = document.getElementById('clock');
  var warned = remainingMs() <= 0;
  stopTick();
  tickTimer = setInterval(function(){
    var ms = remainingMs();
    clockEl.textContent = fmt(ms);
    clockEl.classList.toggle('over', ms < 0);
    if(ms <= 0 && !warned && host.endAt){ warned = true; beep(); }
  }, 250);
  clockEl.classList.toggle('over', remainingMs() < 0);

  document.getElementById('toggle').onclick = function(){
    if(host.endAt){ host.remain = host.endAt - Date.now(); host.endAt = null; }
    else { host.endAt = Date.now() + host.remain; requestWake(); }
    saveHost(); renderHost();
  };
  function shift(d){ if(host.endAt) host.endAt += d; else host.remain += d; saveHost(); renderHost(); }

        '<p>목덜미에 차가운 금속이 닿아 있다는 걸, 당신은 그제야 처음 느낀다.</p>'+
        ''+(im('ending')?'<p class="endart"><img src="'+im('ending')+'" alt="하얀 방에 둥글게 놓인 캡슐 의자 다섯 개. 한 의자에 정장 차림의 사람이 뒷모습으로 앉아 있다."></p>':'')+'<p>눈을 뜨자 하얀 천장. 당신은 캡슐 같은 의자에 누워 있고, 머리엔 무거운 장비가 씌워져 있다. 옆 캡슐에서도 사람들이 하나둘 일어난다. 저택에서 함께 있던 그 얼굴들이다. 그런데 이름이 떠오르지 않는다.</p>'+
        '<p>검은 옷의 남자가 클립보드를 넘기며 말한다. “생존자분들은 이동하겠습니다. 다음 회차가 준비돼 있습니다.”</p>'+
        '<p>묻고 싶다. 여긴 어디고, 나는 언제부터 여기 있었는지. 하지만 저택에서의 기억이 흐릿했던 것처럼, 이 캡슐에 어떻게 들어왔는지도 기억나지 않는다.</p>'+
        '<p>복도 끝 문 위에 글자가 빛난다. <span class="sys">[제2회차]</span></p>'+
        (haeunAlive ? '<p>관람석 한쪽에서 유독 큰 환호성이 터진다. “역시 살인자한테 걸길 잘했어!”</p>' : '')+
      '</blockquote>';
      var survivors = CHARS.filter(function(c){ return lowN.indexOf(c.name) === -1; });
      body += '<h3>개인 에필로그</h3><p class="muted">생존자는 자기 이름 아래 문장을 이어서 소리 내어 읽습니다.</p>'+
        survivors.map(function(c){ return '<div class="stack"><b style="font-family:var(--f-display)">'+c.name+'</b><blockquote class="story"><p>'+esc(c.epi)+'</p></blockquote></div>'; }).join('');
    }
  } else if(step===5){
    var l2 = lowestNames(E.score);
    if(!E.gate){
      body = '<h2>최하위 엔딩</h2><div class="gate"><p><span class="tag-red">최하위</span> '+l2.join(', ')+'</p><p>최하위가 이 화면을 들고 모두 앞에서 소리 내어 읽습니다. 동점이면 한 문단씩 번갈아 읽습니다.</p><button class="btn danger" id="opengate" type="button">최하위 엔딩 열기</button></div>';
    } else {
      body = '<h2>최하위 엔딩</h2><blockquote class="story">'+
        '<p>당신의 이름 옆에 붉은 글자가 뜬다. <span class="tag-red">[최하위]</span></p>'+
        '<p>범인을 찾았든 못 찾았든, 그건 중요하지 않았다.</p>'+
        '<p>어디선가 한숨 소리가 쏟아진다. 표를 구겨 던지는 소리, 웃음소리, 욕설이 뒤섞여 들린다.</p>'+
        ''+(im('ending')?'<p class="endart"><img src="'+im('ending')+'" alt="하얀 방에 둥글게 놓인 캡슐 의자 다섯 개. 한 의자에 정장 차림의 사람이 뒷모습으로 앉아 있다."></p>':'')+'<p>눈을 뜨자 하얀 천장. 유리벽 너머 관람석에서 사람들이 자리를 뜨고 있다. 당신에게 베팅했던 사람들이다. 옆 캡슐의 사람들은 검은 옷의 사람들에게 이끌려 어딘가로 사라진다. 아무도 당신을 돌아보지 않는다.</p>'+
        '<p>대신 이상한 옷을 입은 사람들이 당신의 캡슐을 에워싼다. 흰 가운도 수술복도 아닌, 처음 보는 옷. 얼굴엔 아무 표정이 없다.</p>'+
        '<p>그중 한 명이 당신의 팔을 잡는다. 따끔한 감각. 주사다.</p>'+
        '<p>몸이 무거워지는 동안, 누군가 낮게 말한다.</p>'+
        '<p>“이 사람은 지우지 마. 저장해 둬.”</p>'+
        '<p>당신의 기억은 거기서 끝이 난다.</p>'+
      '</blockquote><p class="sys" style="text-align:center;padding-top:12px">[접속 종료]</p>';
    }
  }

  var canNext = !(step===0 && E.culprit===null) && step < ENDSTEPS.length-1;
  app.innerHTML = topbar('엔딩')+
    '<div class="steps">'+steps+'</div>'+
    '<section class="stack-lg">'+body+'</section>'+
    '<div class="row">'+(step>0?'<button class="btn ghost" id="eprev" type="button">이전</button>':'')+
      (canNext?'<button class="btn primary" id="enext" type="button">다음: '+ENDSTEPS[step+1]+'</button>':'')+'</div>'+
    '<section class="block" style="margin-top:20px"><button class="btn ghost" id="backgame" type="button">진행 화면으로 돌아가기</button></section>';

  app.querySelectorAll('[data-c]').forEach(function(b){ b.onclick = function(){ E.culprit = b.getAttribute('data-c')==='1'; saveHost(); renderEnding(); }; });
  var en = document.getElementById('enext'); if(en) en.onclick = function(){ E.step++; saveHost(); renderEnding(); window.scrollTo(0,0); };
  var ep = document.getElementById('eprev'); if(ep) ep.onclick = function(){ E.step--; E.gate=false; saveHost(); renderEnding(); window.scrollTo(0,0); };
  document.getElementById('backgame').onclick = function(){ host.ending = null; saveHost(); renderHost(); };
  var og = document.getElementById('opengate'); if(og) og.onclick = function(){ E.gate = true; saveHost(); renderEnding(); };
  var cb = document.getElementById('calcbody');
  if(cb) cb.addEventListener('change', function(e){
    var t = e.target; var n = t.getAttribute('data-n'), k = t.getAttribute('data-k'); if(!n) return;
    E.score[n] = E.score[n] || {}; E.score[n][k] = (t.tagName==='SELECT') ? Number(t.value) : t.checked; saveHost();
    var low = lowestNames(E.score);
    CHARS.forEach(function(c){
      var cell = cb.querySelector('[data-total="'+c.name+'"]'); cell.textContent = charTotal(c, E.score);
      cell.parentNode.classList.toggle('lowest', low.indexOf(c.name)!==-1);
    });
    document.getElementById('lowline').innerHTML = '<span class="tag-red">최하위</span> '+low.join(', ');
  });
}

/* ---------- 라우팅 ---------- */
function route(){
  stopTick();
  var h = location.hash.replace('#','');
  if(h==='rules') renderRules();
  else if(h==='host') renderHost();
  else if(CHAR_BY_TOKEN[h]) renderChar(CHAR_BY_TOKEN[h]);
  else renderHome();
}
window.addEventListener('hashchange', function(){ route(); window.scrollTo(0,0); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && host && host.endAt) requestWake(); });
route();
})();
</script>
