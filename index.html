<style>
  :root{
    --bg:#0b0b0c;
    --bg-2:#121214;
    --line:#34343a;
    --silver:#d2d2d8;
    --silver-dim:#a9a9b1;
    --text:#d8d8dc;
    --muted:#8b8b93;
    --serif-en:"Cinzel", "Noto Serif KR", serif;
    --serif-ko:"Noto Serif KR", "Cinzel", serif;
    --sans:"Noto Sans KR", system-ui, sans-serif;
    --ease:cubic-bezier(.75,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--sans);font-weight:300;line-height:1.7;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all;
  }
  body.locked{overflow:hidden}
  a{color:inherit;text-decoration:none}

  /* ───────── 인트로 ───────── */
  .intro{
    position:fixed;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .intro .ibg{position:absolute;inset:0;background:#000}
  .stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
  #burst{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

  .ilogo{
    position:relative;z-index:2;
    width:min(300px,62vw);aspect-ratio:1;
    will-change:transform;
  }
  .ilogo img{width:100%;height:100%;display:block}
  .ilogo #logoSrc,.ilogo .shard{
    -webkit-mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);
    mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);
  }
  .ilogo::after{
    -webkit-mask-image:radial-gradient(circle closest-side,#000 80%,transparent 100%);
    mask-image:radial-gradient(circle closest-side,#000 80%,transparent 100%);
  }
  .ilogo .lit,.ilogo .shard{position:absolute;inset:0}

  /* 불빛 버전 */
  .torch #logoSrc{filter:brightness(.06)}
  .torch .lit{
    filter:brightness(1.7) contrast(1.15) sepia(.5) saturate(1.4);
    -webkit-mask-image:radial-gradient(circle at var(--lx,-40%) var(--ly,30%), #000 0%, #000 10%, rgba(0,0,0,.5) 24%, transparent 42%),radial-gradient(circle closest-side,#000 86%,transparent 100%);
    -webkit-mask-composite:source-in;
    mask-image:radial-gradient(circle at var(--lx,-40%) var(--ly,30%), #000 0%, #000 10%, rgba(0,0,0,.5) 24%, transparent 42%),radial-gradient(circle closest-side,#000 86%,transparent 100%);
    mask-composite:intersect;
  }
  .torch-glow{
    position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
    background:radial-gradient(circle 260px at var(--gx,-500px) var(--gy,-500px), rgba(255,165,85,.16), rgba(255,165,85,.05) 45%, transparent 100%);
  }

  /* 조각 버전 */
  .shards #logoSrc{opacity:0}
  .torch .shard{filter:brightness(.32)}
  .shard{background-size:100% 100%;will-change:transform,opacity}
  .ilogo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);
    background-size:260% 100%;background-position:160% 0;
    mix-blend-mode:overlay;
  }
  .ilogo.shine::after{animation:shine 1.1s ease-in-out forwards}
  @keyframes shine{to{background-position:-60% 0}}

  .ititle{
    position:relative;z-index:2;margin-top:40px;
    font-family:var(--serif-en);font-weight:400;
    font-size:clamp(18px,3.6vw,28px);letter-spacing:.45em;padding-left:.45em;
    color:var(--silver);white-space:nowrap;
  }
  .ititle span{
    display:inline-block;opacity:0;transform:translateY(10px);filter:blur(8px);
    transition:opacity .9s ease,transform .9s ease,filter .9s ease;
  }
  .ititle span.in{opacity:1;transform:none;filter:blur(0)}
  .ititle.away{transition:opacity .6s ease,transform .8s var(--ease);opacity:0;transform:translateY(-14px)}
  .skip{
    position:absolute;right:24px;bottom:22px;z-index:2;
    font-family:var(--serif-en);font-size:11px;letter-spacing:.3em;color:#55555c;
  }

  /* ───────── 헤더 ───────── */
  .top{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:36px;
    padding:24px 44px;
    font-family:var(--serif-en);font-size:17px;font-weight:600;letter-spacing:.1em;color:#e4e4e8;
    text-shadow:0 1px 8px rgba(0,0,0,.6);
    transition:background .5s ease,border-color .5s ease,padding .5s ease;
    border-bottom:1px solid transparent;
  }
  .top.scrolled{background:rgba(11,11,12,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:var(--line);padding:14px 44px}
  .brand{display:flex;align-items:center;gap:16px;margin-right:auto}
  .brand img{
    width:54px;height:54px;display:block;opacity:0;
    -webkit-mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);
    mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);
  }
  .brand span{color:#f2f2f5;letter-spacing:.14em;font-size:21px;font-weight:600}
  .top .fx{opacity:0;transform:translateY(-6px);transition:opacity .8s ease,transform .8s ease}
  .top.show .fx{opacity:1;transform:none}
  .top a.nav{transition:color .3s}
  .top a.nav:hover,.lang button:hover{color:#fff}
  .lang{display:flex;gap:6px;align-items:center}
  .lang{margin-left:8px;font-size:15px}
  .lang button{background:none;border:0;cursor:pointer;color:#8f8f97;font:inherit;letter-spacing:.1em;padding:2px}
  .lang button.on{color:#fff}
  .lang span{color:#55555c}

  /* ───────── 메인 ───────── */
  .hero{
    position:relative;overflow:hidden;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:110px 16px 64px;
    background:radial-gradient(ellipse at 50% 50%, #18181b 0%, var(--bg) 65%);
  }
  .wm{
    position:absolute;left:50%;top:50%;width:min(1100px,150vw);aspect-ratio:1;
    transform:translate(-50%,-50%);opacity:0;filter:blur(2px) grayscale(1);
    -webkit-mask-image:radial-gradient(circle closest-side,#000 40%,transparent 100%);
    mask-image:radial-gradient(circle closest-side,#000 40%,transparent 100%);
    transition:opacity 3s ease;pointer-events:none;
  }
  .wm.in{opacity:.07;animation:spin 240s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  #dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .hero .vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.75) 100%)}
  .hero-in{position:relative;z-index:1}
  .hero h1{
    font-family:var(--serif-en);font-weight:400;
    font-size:clamp(30px,7vw,82px);letter-spacing:.28em;
    color:var(--silver);line-height:1.15;
    text-shadow:0 0 40px rgba(200,200,215,.12);
  }
  .hero h1 .w1{display:inline-block;padding-left:.28em}
  .hero h1 em{display:block;font-style:normal;font-size:1em;letter-spacing:inherit;padding-left:.28em;margin-top:.08em;color:var(--silver);text-shadow:0 0 30px rgba(200,200,215,.15)}
  .rule{width:48px;height:1px;background:var(--silver-dim);margin:30px auto;opacity:.6}
  .hero p{margin-top:44px;font-family:var(--serif-en);color:#b4b4bb;font-size:24px;font-weight:600;letter-spacing:.12em;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .scroll{
    display:inline-block;margin-top:80px;font-family:var(--serif-en);font-size:15px;font-weight:600;
    letter-spacing:.3em;color:var(--silver-dim);
  }
  .scroll::after{
    content:"";display:block;width:1px;height:46px;margin:14px auto 0;
    background:linear-gradient(var(--silver-dim),transparent);
    transform-origin:top;animation:drip 2.4s ease-in-out infinite;
  }
  @keyframes drip{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}

  .hfx{opacity:0;transform:translateY(18px);transition:opacity 1.4s ease,transform 1.4s ease}
  .hfx.in{opacity:1;transform:none}
  .hero h1.hfx{transform:none;letter-spacing:.6em;transition:opacity 1.6s ease,letter-spacing 2.2s var(--ease)}
  .hero h1.hfx.in{letter-spacing:.28em}

  /* ───────── 섹션 공통 ───────── */
  section{padding:130px 16px;max-width:1080px;margin:0 auto}
  .label{
    text-align:center;font-family:var(--serif-en);font-weight:400;
    font-size:15px;letter-spacing:.4em;color:var(--silver);padding-left:.4em;
  }
  .label + .rule{margin-bottom:70px}

  /* 게임 카드 */
  .games{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px}
  .card{background:var(--bg-2);border:1px solid var(--line);transition:border-color .5s,transform .5s}
  .card:hover{border-color:#4a4a52;transform:translateY(-4px)}
  .shot{
    aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--line);overflow:hidden;position:relative;
  }
  .shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s ease}
  .card:hover .shot img{transform:scale(1.04)}
  .shot::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%);
    background-size:260% 100%;background-position:160% 0;transition:background-position 1.2s ease;
  }
  .card:hover .shot::after{background-position:-60% 0}
  .shot{aspect-ratio:2/1;background:#0d0d0f}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .tags .tag{margin-top:0}
  .tag.live{color:#0b0b0c;background:var(--silver);border-color:var(--silver);font-weight:500}
  .btns{margin-top:auto;padding-top:24px}
  #games{max-width:1240px}
  .games{gap:32px}
  .card{display:flex;flex-direction:column}
  .info{flex:1;display:flex;flex-direction:column}
  .btn{
    display:inline-block;padding:11px 20px;border:1px solid #5a5a62;
    font-family:var(--serif-en);font-size:13px;font-weight:600;letter-spacing:.1em;color:#e4e4e8;
    transition:background .3s,color .3s,border-color .3s;
  }
  .btn::after{content:" \2192"}
  .btn:hover{background:var(--silver);color:#0b0b0c;border-color:var(--silver)}
  .info h3{line-height:1.4}
  .shot .ph{font-family:var(--serif-ko);font-size:28px;letter-spacing:.2em;color:#4a4a50}
  .shot.mangja{background:radial-gradient(ellipse at 50% 40%,#1d1a1f,#0e0d10)}
  .shot.poker{background:radial-gradient(ellipse at 50% 40%,#16191a,#0d0f10)}
  .info{padding:28px 28px 30px}
  .info h3{font-family:var(--serif-ko);font-weight:600;font-size:21px;color:var(--silver);letter-spacing:.06em}
  .info p{margin-top:14px;font-size:15px;font-weight:400;color:var(--silver-dim)}
  .tag{display:inline-block;margin-top:22px;padding:5px 12px;border:1px solid var(--line);font-size:11px;letter-spacing:.15em;color:var(--silver)}

  /* 연락처 */
  .contact{text-align:center}
  .contact .mail{
    font-family:var(--serif-en);font-size:clamp(16px,3vw,22px);letter-spacing:.08em;color:var(--silver);
    border-bottom:1px solid var(--line);padding-bottom:6px;transition:border-color .3s;
  }
  .contact .mail:hover{border-color:var(--silver-dim)}
  .contact p{margin-top:20px;font-size:15px;color:var(--silver-dim)}

  /* 하단 회사 정보 */
  footer{border-top:1px solid var(--line);padding:48px 16px 56px;text-align:center;font-size:13px;color:var(--muted);line-height:2}
  footer .biz span{display:inline-block;margin:0 10px}
  footer .links{margin-top:14px}
  footer .links a{color:var(--silver-dim);border-bottom:1px solid var(--line)}
  footer .links a:hover{color:var(--silver)}
  footer .copy{margin-top:18px;font-family:var(--serif-en);letter-spacing:.2em;font-size:11px}

  /* 스크롤 등장 */
  .fade{opacity:0;transform:translateY(22px);transition:opacity 1.2s ease,transform 1.2s ease}
  .fade.in{opacity:1;transform:none}

  @media (prefers-reduced-motion: reduce){
    .fade,.hfx{opacity:1;transform:none;transition:none}
    .wm.in{animation:none}
    .scroll::after{animation:none}
    html{scroll-behavior:auto}
  }
  @media (max-width:600px){
    .top,.top.scrolled{padding:12px 16px;gap:16px}
    .top .nav{display:none}
    .brand{gap:10px}
    .brand img{width:40px;height:40px}
    .brand span{font-size:15px;letter-spacing:.1em}
    .lang{font-size:14px}
    .hero p{font-size:19px;letter-spacing:.08em}
    section{padding:96px 16px}
    .info{padding:22px 20px 24px}
    footer .biz span{display:block;margin:0}
    .scroll{font-size:13px}
  }
</style>
</head>

    if(done) return; done = true;
    var a = ilogo.getBoundingClientRect(), b = $('hlogo').getBoundingClientRect();
    var dx = (b.left + b.width/2) - (a.left + a.width/2);
    var dy = (b.top + b.height/2) - (a.top + a.height/2);
    var s = b.width / a.width;
    ititle.classList.add('away');
    $('glow').style.transition = 'opacity .5s'; $('glow').style.opacity = 0;
    intro.querySelector('.ibg').animate([{opacity:1},{opacity:0}], {duration:1100, easing:'ease', fill:'forwards'});
    intro.querySelector('.skip').style.opacity = 0;
    var anim = ilogo.animate(
      [{transform:'translate(0,0) scale(1)'},{transform:'translate('+dx+'px,'+dy+'px) scale('+s+')'}],
      {duration:1100, easing:'cubic-bezier(.75,0,.2,1)', fill:'forwards'}
    );
    setTimeout(function(){ top.classList.add('show'); }, 650);
    setTimeout(revealPage, 500);
    anim.onfinish = function(){ $('hlogo').style.opacity = 1; cancelAnimationFrame(raf); intro.remove(); };
  }
  function outro(delay){
    at(delay + 200, function(){ ilogo.classList.add('shine'); });
    letters.forEach(function(l, i){ at(delay + i * 70, function(){ l.classList.add('in'); }); });
    at(delay + 1900, fly);
  }

  /* ── 횃불 빛 ── */
  var lit;
  function torchSetup(){
    lit = base.cloneNode(); lit.removeAttribute('id'); lit.className = 'lit'; lit.style.opacity = 0;
    ilogo.appendChild(lit);
  }
  function torchRun(){
    var glow = $('glow'), t0 = performance.now(), D = 2800, R = ilogo.getBoundingClientRect();
    glow.style.transition = 'opacity .8s'; glow.style.opacity = 1;
    function ease(p){ return p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2; }
    function frame(now){
      var t = now - t0, p = Math.min(t / D, 1), e = ease(p);
      var lx = -35 + 170 * e, ly = 38 - 18 * Math.sin(Math.PI * e);
      ilogo.style.setProperty('--lx', lx + '%'); ilogo.style.setProperty('--ly', ly + '%');
      glow.style.setProperty('--gx', (R.left + R.width * lx / 100) + 'px');
      glow.style.setProperty('--gy', (R.top + R.height * ly / 100) + 'px');
      var flick = .84 + .09 * Math.sin(t * .021) + .07 * Math.sin(t * .057 + 1.3);
      if(!lit.dataset.out) lit.style.opacity = flick;
      if(p < 1) raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    at(1700, function(){ base.style.transition = 'filter 1.6s ease'; base.style.filter = 'brightness(1)'; });
    at(2700, function(){ lit.dataset.out = 1; lit.style.transition = 'opacity 1s ease'; lit.style.opacity = 0; glow.style.opacity = 0; });
  }
  function torchEnd(){
    cancelAnimationFrame(raf);
    base.style.transition = 'none'; base.style.filter = 'brightness(1)';
    if(lit){ lit.dataset.out = 1; lit.style.opacity = 0; }
  }

  /* ── 돌 조각 ── */
  var shards = [], impactTimer;
  function shardSetup(){
    var N = 5, P = [], i, j;
    for(i = 0; i <= N; i++){ P[i] = []; for(j = 0; j <= N; j++){
      var x = i / N * 100, y = j / N * 100;
      if(i > 0 && i < N) x += (Math.random() - .5) * 11;
      if(j > 0 && j < N) y += (Math.random() - .5) * 11;
      P[i][j] = [x, y];
    }}
    var url = 'url("' + base.src + '")';
    function add(tri){
      var cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
      var d = document.createElement('div'); d.className = 'shard';
      d.style.backgroundImage = url;
      d.style.clipPath = 'polygon(' + tri.map(function(p){ return p[0] + '% ' + p[1] + '%'; }).join(',') + ')';
      d.style.transformOrigin = cx + '% ' + cy + '%';
      d.style.opacity = 0;
      d._c = [cx, cy];
      ilogo.appendChild(d); shards.push(d);
    }
    for(i = 0; i < N; i++) for(j = 0; j < N; j++){
      var a = P[i][j], b = P[i+1][j], c = P[i+1][j+1], e = P[i][j+1];
      if(Math.random() < .5){ add([a, b, c]); add([a, c, e]); } else { add([a, b, e]); add([b, c, e]); }
    }
  }
  // 조각마다 바깥쪽으로 흩어진 위치
  function spread(s, dmin, dmax, rot){
    var vx = s._c[0] - 50, vy = s._c[1] - 50, len = Math.hypot(vx, vy) || 1, d = rnd(dmin, dmax);
    return {x: vx / len * d + rnd(-.3, .3) * d * .5, y: vy / len * d + rnd(-.3, .3) * d * .5, r: rnd(-rot, rot)};
  }
  function T(o, sc){ return 'translate(' + o.x + 'px,' + o.y + 'px) rotate(' + o.r + 'deg) scale(' + sc + ')'; }
  var HOME = 'translate(0,0) rotate(0deg) scale(1)';

  function assemble(onImpact){
    var last = 0;
    shards.forEach(function(s){
      var o = spread(s, 200, 400, 70), del = rnd(0, 320), dur = rnd(950, 1230);
      last = Math.max(last, del + dur);
      s.animate([{transform:T(o, .8), opacity:0},{opacity:1, offset:.3},{transform:HOME, opacity:1}],
        {duration:dur, delay:del, easing:'cubic-bezier(.5,0,.9,.5)', fill:'both'});
    });
    impactTimer = setTimeout(onImpact, last);
  }
  function shardEnd(){
    clearTimeout(impactTimer);
    shards.forEach(function(s){ s.remove(); }); shards = [];
    base.style.opacity = 1;
  }
  function shake(power){
    var p = power || 1;
    stage.animate([
      {transform:'translate(0,0)'},{transform:'translate(' + (-7*p) + 'px,' + (5*p) + 'px)'},{transform:'translate(' + (6*p) + 'px,' + (-4*p) + 'px)'},
      {transform:'translate(' + (-4*p) + 'px,' + (-3*p) + 'px)'},{transform:'translate(' + (3*p) + 'px,' + (2*p) + 'px)'},{transform:'translate(0,0)'}
    ], {duration:420, easing:'ease-out'});
  }
  function impact(dim){
    if(done) return;
    shardEnd();
    if(dim) base.animate([{filter:'brightness(.9)'},{filter:'brightness(.06)'}], {duration:700, easing:'ease-out'});
    else base.animate([{filter:'brightness(2.4)'},{filter:'brightness(1)'}], {duration:700, easing:'ease-out'});
    shake(1);
    burst(dim ? .5 : 1);
  }
  function burst(power){
    var cv = $('burst'), ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
    var W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    var r0 = ilogo.getBoundingClientRect(), cx = r0.left + r0.width/2, cy = r0.top + r0.height/2, R = r0.width * .44;
    var ps = [], n = Math.round(140 * (power || 1));
    for(var i = 0; i < n; i++){
      var ang = Math.random() * 6.283, sp = 1.5 + Math.random() * 6.5;
      ps.push({x:cx + Math.cos(ang) * R * rnd(.7, 1), y:cy + Math.sin(ang) * R * rnd(.7, 1),
        vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp - 1, s:rnd(.6, 3.2),
        rot:Math.random() * 6.28, vr:rnd(-.15, .15),
        g:Math.round(rnd(110, 220) * (power < 1 ? .6 : 1)), life:0, max:rnd(45, 90)});
    }
    (function draw(){
      ctx.clearRect(0, 0, W, H);
      var alive = 0;
      ps.forEach(function(p){
        if(p.life > p.max) return; alive++;
        p.life++; p.vx *= .97; p.vy = p.vy * .97 + .14; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = 1 - p.life / p.max;
        ctx.fillStyle = 'rgb(' + p.g + ',' + p.g + ',' + (p.g + 6) + ')';
        ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s * (.6 + (p.g % 3) * .3));
        ctx.restore();
      });
      if(alive) requestAnimationFrame(draw); else ctx.clearRect(0, 0, W, H);
    })();
  }

  /* 기본형: 날아와서 쿵 */
  function runBasic(){
    assemble(function(){ impact(false); outro(250); });
  }

  /* 확장 1: 어둠 속에서 맞춰지고 → 횃불이 비추기 */
  function runTorch(){
    assemble(function(){
      impact(true);
      at(450, torchRun);
      at(450 + 1700, function(){ ilogo.classList.add('shine'); });
      letters.forEach(function(l, i){ at(450 + 2300 + i * 70, function(){ l.classList.add('in'); }); });
      at(450 + 4100, fly);
    });
  }

  /* 확장 2: 멀쩡한 로고가 깨져서 터지고 → 다시 쿵 */
  function runShatter(){
    base.style.opacity = 1;
    base.animate([{opacity:0, transform:'scale(1.06)'},{opacity:1, transform:'scale(1)'}], {duration:900, easing:'ease-out'});
    at(1200, function(){ shake(.5); });
    at(1550, function(){
      base.style.opacity = 0;
      var outs = [], last = 0;
      shards.forEach(function(s){
        var o = spread(s, 150, 330, 90); outs.push(o);
        s.style.opacity = 1;
        s.animate([{transform:HOME},{transform:T(o, .85)}], {duration:rnd(650, 850), easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      });
      shake(1.4); burst(.8);
      at(1100, function(){
        shards.forEach(function(s, i){
          var del = rnd(0, 180), dur = rnd(620, 820); last = Math.max(last, del + dur);
          s.animate([{transform:T(outs[i], .85)},{transform:HOME}], {duration:dur, delay:del, easing:'cubic-bezier(.6,0,.95,.5)', fill:'both'});
        });
        impactTimer = setTimeout(function(){ impact(false); outro(250); }, last);
      });
    });
  }

  /* 확장 3: 공중에 둥둥 떠 있다가 → 확 빨려 들어가서 쿵 */
  function runFloat(){
    var D = 2600;
    shards.forEach(function(s){
      var o1 = spread(s, 110, 210, 40), o2 = {x:o1.x * .82 + rnd(-14, 14), y:o1.y * .82 + rnd(-14, 14), r:o1.r + rnd(-25, 25)};
      s.animate([
        {transform:T(o1, .92), opacity:0},
        {transform:T(o1, .92), opacity:.95, offset:.28},
        {transform:T(o2, .92), opacity:.95, offset:.86, easing:'cubic-bezier(.75,0,1,.6)'},
        {transform:HOME, opacity:1}
      ], {duration:D, delay:rnd(0, 60), easing:'linear', fill:'both'});
    });
    impactTimer = setTimeout(function(){ impact(false); outro(250); }, D + 60);
  }

  /* 중간형: 부웅~ 모였다가 파파팍 */
  function runMid(){
    var HOVER = 720, last = 0;
    shards.forEach(function(s){
      var o1 = spread(s, 150, 270, 55);
      var o2 = {x:o1.x * .74 + rnd(-10, 10), y:o1.y * .74 + rnd(-10, 10), r:o1.r * .6 + rnd(-12, 12)};
      var start = HOVER + rnd(0, 300), dur = rnd(300, 420), total = start + dur;
      last = Math.max(last, total);
      s.animate([
        {transform:T(o1, .9), opacity:0, easing:'cubic-bezier(.2,.6,.4,1)'},
        {transform:T(o2, .93), opacity:.95, offset:start / total, easing:'cubic-bezier(.7,0,1,.6)'},
        {transform:HOME, opacity:1}
      ], {duration:total, easing:'linear', fill:'both'});
    });
    impactTimer = setTimeout(function(){ impact(false); outro(250); }, last);
  }

  function skip(){
    if(done) return;
    timers.forEach(clearTimeout);
    shardEnd(); torchEnd();
    letters.forEach(function(l){ l.classList.add('in'); });
    fly();
  }

  shardSetup();
  if(MODE === 'torch') torchSetup();

  if(reduce){
    shardEnd(); torchEnd();
    intro.remove(); done = true;
    top.classList.add('show'); $('hlogo').style.opacity = 1; revealPage();
  } else {
    intro.addEventListener('click', skip);
    addEventListener('keydown', function(){ skip(); }, {once:true});
    var run = {basic:runBasic, torch:runTorch, shatter:runShatter, float:runFloat, mid:runMid}[MODE];
    at(250, run);
  }

  /* ── 떠다니는 먼지 ── */
  function startDust(){
    if(reduce) return;
    var cv = $('dust'), ctx = cv.getContext('2d'), w, h, dpr, parts = [];
    function size(){
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = cv.offsetWidth; h = cv.offsetHeight;
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      var n = Math.min(110, Math.round(w * h / 14000));
      parts = [];
      for(var i = 0; i < n; i++) parts.push(make(true));
    }
    function make(any){
      return {
        x: Math.random() * w,
        y: any ? Math.random() * h : h + 10,
        r: Math.random() * 1.4 + .3,
        vy: -(Math.random() * .35 + .08),
        sway: Math.random() * 6.28, sp: Math.random() * .01 + .004,
        a: Math.random() * .5 + .1, tw: Math.random() * 6.28
      };
    }
    var running = true;
    document.addEventListener('visibilitychange', function(){ running = !document.hidden; if(running) requestAnimationFrame(tick); });
    function tick(){
      if(!running) return;
      ctx.clearRect(0, 0, w, h);
      for(var i = 0; i < parts.length; i++){
        var p = parts[i];
        p.y += p.vy; p.sway += p.sp; p.tw += .03;
        var x = p.x + Math.sin(p.sway) * 18;
        var alpha = p.a * (.6 + .4 * Math.sin(p.tw));
        if(p.y < -10) parts[i] = make(false);
        ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, 6.283);
        ctx.fillStyle = 'rgba(215,215,225,' + alpha + ')';
        ctx.shadowColor = 'rgba(220,220,235,.8)'; ctx.shadowBlur = p.r * 4;
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    size(); addEventListener('resize', size);
    requestAnimationFrame(tick);
  }

  /* ── 스크롤하면 천천히 나타나기 ── */
  var items = document.querySelectorAll('.fade');
  if('IntersectionObserver' in window && !reduce){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, {threshold:.15});
    items.forEach(function(el){ io.observe(el); });
  } else {
    items.forEach(function(el){ el.classList.add('in'); });
  }
})();
</script>
</body>
</html>
